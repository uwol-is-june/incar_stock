name: Daily Stock Collect

on:
  workflow_dispatch:
  # schedule: 은 ADR-003에 따라 제거됨 (GitHub schedule 피크 시간대 2~3시간 지연 → cron-job.org 정시 트리거 + workflow_dispatch 사용)
  # 남아 있던 schedule 트리거가 다음 날 01:58 KST 같은 지연 실행을 만들어 과거 보고서를 덮어썼음.

jobs:
  collect:
    runs-on: ubuntu-latest
    # 지연 실행·중복 트리거가 겹치면 앞 실행이 끝난 뒤에 돈다 (보고서 동시 쓰기 방지)
    concurrency:
      group: daily-collect-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/run_collect.py

      - name: Commit and push reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily stock report $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
